name: Windows 7 版 构建与发布

# ══════════════════════════════════════════════════════════════════════
#  给 ClassSoftwareHub 的 Windows 7 移植版（Avalonia 11 + .NET 6）出包。
#
#  本仓库（ClassSoftwareHub-windows7）就是 Win7 版**自己的仓库**（2026-10-04 独立成库），
#  Release 列表天然与 WinUI 版（ClassSoftwareHub-Desktop）隔离 —— tag **不需要任何前缀**。
#
#  产出两样东西（都在 Release 里）：
#    ① 便携版  ClassSoftwareHub-Portable-win7-dv<版本>.zip   —— 「启动器 + app 文件夹」两层
#    ② 安装版  ClassSoftwareHub-Setup-win7-dv<版本>.exe      —— Inno Setup 6
#
#  ⚠️ 发布 tag 形如 dv1.0.0（正式版）或 dv1.0.0-insider1.1（预览版，带 insider 自动勾 Pre-release）。
#
#  ⚠️ 产物是**正式版**构建：不带 -p:CshConsoleBuild=true，
#     所以 exe 是 WinExe（Windows 子系统）—— 双击只出界面，不弹控制台黑窗。
#
#  ⚠️ 构建签名：官方包必须带签名（见 src/Core/BuildIdentity.cs），否则发出去就是「社区版」，
#     在线服务会被后端拦。签名在 publish 期由 -p:CshBuildStampB64 编进程序集元数据，
#     发布目录里**没有**明文的 build-stamp.txt —— 明文文件太容易被顺手拷走。
#     签名文件只在 RUNNER_TEMP 里存在几秒，读完即删，工作区与产物都不留。
#     密钥存在仓库 Secret CSH_BUILD_SECRET 里（Settings → Secrets and variables → Actions），
#     不进仓库。没配这个 Secret 时本工作流会**直接失败**，这是有意的：宁可不出包，也不发错包。
# ══════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 dv / win7- 前缀，如 1.0.0）；留空 = 自动读 ShellConfig.cs'
        required: false
        default: ''
      publish:
        description: '构建完直接创建 GitHub Release？'
        required: false
        type: boolean
        default: false
      notes:
        description: '本次更新说明（会原样显示在「更新日志」与更新对话框里）'
        required: false
        default: ''
  push:
    tags:
      - 'dv*'

# 创建 Release + 上传资产需要写权限
permissions:
  contents: write

env:
  DOTNET_VERSION: '6.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  PROJECT_APP: 'src/ClassSoftwareHub.Win7.csproj'
  PROJECT_LAUNCHER: 'src/Launcher/ClassSoftwareHub.Launcher.csproj'

jobs:
  build:
    name: 构建便携版与安装版
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 读 tag / 生成变更说明都要完整历史

      - name: 安装 .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 确定版本号
        id: ver
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $v = $env:INPUT_VERSION

          # 由 tag 触发时，版本号以 tag 为准（dv1.0.0 → 1.0.0）
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
            # 兼容历史上的 win7- 前缀写法，免得老 tag 重跑时解析错
            $v = $tag -replace '^win7-', '' -replace '^dv', ''
          }

          # 两处都没给 → 读源码里的唯一版本号来源
          if ([string]::IsNullOrWhiteSpace($v)) {
            $src = Get-Content -LiteralPath 'src/Core/ShellConfig.cs' -Raw
            $m = [regex]::Match($src, 'ShellVersion\s*=\s*"([^"]+)"')
            if (-not $m.Success) { throw '读不到 src/Core/ShellConfig.cs 里的 ShellVersion' }
            $v = $m.Groups[1].Value
          }

          $channel = if ($v -like '*insider*') { 'insider' } else { 'stable' }
          Write-Host "版本号 : $v"
          Write-Host "通道   : $channel"
          Write-Host "tag    : dv$v"

          "version=$v"      >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT

      # ── 1. 生成官方构建签名 ──
      #    构建号用 commit 短 SHA 而非时间戳：同一提交重跑得到同一份签名，便于复现与排障。
      #    签名必须在 publish **之前**算出 —— 它要作为 -p:CshBuildStampB64 编进程序集元数据。
      - name: 生成官方构建签名
        id: stamp
        shell: pwsh
        env:
          CSH_BUILD_SECRET: ${{ secrets.CSH_BUILD_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSH_BUILD_SECRET)) {
            throw '缺少仓库 Secret CSH_BUILD_SECRET（Settings → Secrets and variables → Actions → New repository secret）。'
          }
          $v = '${{ steps.ver.outputs.version }}'
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          # ⚠️ 落盘一律用绝对路径：make-build-stamp.ps1 走 .NET 的 WriteAllText，
          #    相对路径按**进程** CWD 解析，与 PowerShell 的 location 不是同一套东西。
          # ⚠️ 写到 RUNNER_TEMP 而不是工作区：签名只以 base64 进程序集，工作树里连临时明文都不留。
          $stamp = Join-Path $env:RUNNER_TEMP 'build-stamp.txt'
          ./tools/make-build-stamp.ps1 -Version $v -BuildId "dv$v+$sha" -OutFile $stamp
          if (-not $?) { throw '构建签名生成失败' }

          $line = (Get-Content -LiteralPath $stamp -Raw).Trim()
          $b64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($line))
          Remove-Item -LiteralPath $stamp -Force
          "b64=$b64" >> $env:GITHUB_OUTPUT
          Write-Host "构建号   ：dv$v+$sha"
          Write-Host "base64   ：$b64"
          Write-Host "（明文签名行只在本进程里出现，不落工作区）"

      # ── 2. 应用本体（注意：不带 CshConsoleBuild → WinExe，无控制台窗口）──
      #    签名通过 -p:CshBuildStampB64 编进程序集，发布目录里**不再**有 build-stamp.txt。
      - name: 发布应用本体（WinExe，无控制台）
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT_APP `
            -c Release -r win-x64 --self-contained true `
            -p:PublishTrimmed=false -p:PublishReadyToRun=true `
            -p:Version=${{ steps.ver.outputs.version }} `
            "-p:CshBuildStampB64=${{ steps.stamp.outputs.b64 }}" `
            -o dist/win7/app
          if ($LASTEXITCODE -ne 0) { throw '应用本体发布失败' }

      # ── 3. 启动器（自包含 + 裁剪 + 单文件）──
      - name: 发布启动器
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT_LAUNCHER `
            -c Release -r win-x64 `
            -p:Version=${{ steps.ver.outputs.version }} `
            -o dist/win7
          if ($LASTEXITCODE -ne 0) { throw '启动器发布失败' }

      # ── 4. 组装便携版（启动器 + app 文件夹）并打 zip ──
      - name: 组装便携版
        shell: pwsh
        run: |
          ./tools/pack-win7-portable.ps1 `
            -AppDir dist/win7/app `
            -LauncherDir dist/win7 `
            -Version ${{ steps.ver.outputs.version }} `
            -OutRoot dist `
            -BuildStampB64 '${{ steps.stamp.outputs.b64 }}' `
            -Zip
          # ⚠️ 这里**不能**用 $LASTEXITCODE 判定 —— 那是给原生命令（dotnet/ISCC/node）用的。
          #    调用 .ps1 脚本时它不会被设置：每个 step 都是全新的 pwsh 进程，
          #    $LASTEXITCODE 初值为 $null，而 `$null -ne 0` 为真 → 明明打包成功也会报"组装失败"。
          #    脚本调用看 $? 才对（脚本内部已有 $ErrorActionPreference='Stop' + 关键处 throw）。
          if (-not $?) { throw '便携版组装失败' }

      # ── 5. 校验便携包确实带签名 ──
      #    打包脚本本身已经会拦，这里再验一遍最终 zip：漏发一次无签名包，
      #    等于让所有装上去的人在开闸门后瞬间全部被拦，事故量级太大，多一道无损检查值得。
      #    现在签名在程序集元数据里，所以检查的是 app\ClassSoftwareHub.dll 的字节。
      - name: 校验便携包带官方签名
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'   # Expand-Archive 的进度条会把日志刷爆
          $zip = "dist/ClassSoftwareHub-Portable-win7-dv${{ steps.ver.outputs.version }}.zip"
          if (-not (Test-Path -LiteralPath $zip)) { throw "找不到便携包：$zip" }
          # 用 Expand-Archive 而不是 System.IO.Compression.ZipFile：
          # 前者在 Windows PowerShell 5.1 与 pwsh 7 上都可用，后者在 5.1 里需要 Add-Type。
          $tmp = Join-Path $env:RUNNER_TEMP 'stamp-check'
          if (Test-Path -LiteralPath $tmp) { Remove-Item -LiteralPath $tmp -Recurse -Force }
          Expand-Archive -LiteralPath $zip -DestinationPath $tmp -Force

          # 不该再有明文签名文件（有的话说明用了旧流程）
          $txt = Get-ChildItem -LiteralPath $tmp -Recurse -Filter 'build-stamp.txt' | Select-Object -First 1
          if ($txt) { throw "便携包里仍有明文 build-stamp.txt（$($txt.FullName)）—— 旧打包流程没退干净。" }

          $dll = Get-ChildItem -LiteralPath $tmp -Recurse -Filter 'ClassSoftwareHub.dll' | Select-Object -First 1
          if (-not $dll) { throw '便携包里找不到 ClassSoftwareHub.dll。' }
          $bytes = [System.IO.File]::ReadAllBytes($dll.FullName)
          if ($bytes.Length % 2 -ne 0) { $bytes = $bytes[0..($bytes.Length - 2)] }
          # AssemblyMetadata 的字符串参数在元数据里是 UTF-8（SerString），同时试 UTF-16 兜底
          $b64 = '${{ steps.stamp.outputs.b64 }}'
          $hit = ([System.Text.Encoding]::UTF8.GetString($bytes).Contains($b64) -or
                  [System.Text.Encoding]::Unicode.GetString($bytes).Contains($b64))
          if (-not $hit) {
            throw '程序集里找不到构建签名 —— 该包会被当成社区版，停止发布。'
          }
          Write-Host "✓ 签名已在程序集元数据内（$($dll.Name)，$([math]::Round($dll.Length / 1MB, 1)) MB）"
          Remove-Item -LiteralPath $tmp -Recurse -Force

      # ── 6. 编译安装版 ──
      - name: 编译安装包（Inno Setup 6）
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "找不到 Inno Setup：$iscc" }
          & $iscc 'installer\ClassSoftwareHub-Win7.iss' "/DDesktopVersion=${{ steps.ver.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw '安装包编译失败' }

      # ── 7. 留档（哪怕是手动跑、不发 Release 也拿得到产物）──
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ClassSoftwareHub-Win7-dv${{ steps.ver.outputs.version }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/ClassSoftwareHub-Portable-win7-dv*.zip
            dist/installer/ClassSoftwareHub-Setup-win7-dv*.exe

      # ── 8. 生成更新说明 ──
      - name: 生成更新说明
        id: notes
        shell: pwsh
        env:
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          New-Item -ItemType Directory -Path dist/release -Force | Out-Null
          $path = 'dist/release/notes.md'

          # 发布说明以仓库里的 docs/releases/dv<版本>.md 为准（与历史 Release 同一套正式格式）；
          # 没有该文件时才用工作流参数 / git log 兜底。
          $doc = "docs/releases/dv${{ steps.ver.outputs.version }}.md"
          if (Test-Path -LiteralPath $doc) {
            Copy-Item -LiteralPath $doc -Destination $path -Force
            Write-Host "使用发布说明：$doc"
          }
          elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_NOTES)) {
            [System.IO.File]::WriteAllText($path, $env:INPUT_NOTES, (New-Object System.Text.UTF8Encoding($false)))
          } else {
            $lines = @("ClassSoftwareHub dv${{ steps.ver.outputs.version }}（Windows 7 版）", '')
            $prev = (git describe --tags --abbrev=0 --match 'dv*' 'HEAD^' 2>$null)
            if ($LASTEXITCODE -eq 0 -and $prev) {
              $range = "$prev..HEAD"
            } else {
              $range = '-20'
            }
            $lines += '本次改动：'
            $lines += (git log $range --pretty=format:'- %s' --no-merges)
            [System.IO.File]::WriteAllLines($path, $lines, (New-Object System.Text.UTF8Encoding($false)))
          }
          Get-Content -LiteralPath $path | Select-Object -First 30 | ForEach-Object { Write-Host $_ }
          "path=$path" >> $env:GITHUB_OUTPUT

      # ── 9. 发 Release（打 tag / 勾了 publish 才发）──
      - name: 创建 GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          # 正文首行引用的配图要和 Release 资产同名（dv1.2.png），否则正文顶部是 404 图
          $img = 'Assets/dv1.2.png'
          if (-not (Test-Path -LiteralPath $img)) { throw "缺少 Release 配图：$img" }
          node tools/publish-release-win7.mjs `
            --version $v `
            --channel ${{ steps.ver.outputs.channel }} `
            --installer "dist/installer/ClassSoftwareHub-Setup-win7-dv$v.exe" `
            --portable  "dist/ClassSoftwareHub-Portable-win7-dv$v.zip" `
            --image     $img `
            --notes     "${{ steps.notes.outputs.path }}"
          if ($LASTEXITCODE -ne 0) { throw '创建 Release 失败' }
